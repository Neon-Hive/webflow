<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: 'Cascadia Mono', Consolas, monospace; transition: background .4s, color .4s; touch-action: none; user-select: none; cursor: grab; }
  body.drag { cursor: grabbing; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #num { position: absolute; left: 5vw; bottom: 7vh; display: flex; font-size: min(24vw, 36vh); letter-spacing: -.06em; }
  .col { height: 1em; overflow: hidden; }
  .strip { will-change: transform; }
  .strip span { display: block; height: 1em; line-height: 1em; }
  #titles { position: absolute; left: 5vw; top: 13vh; width: 46vw; }
  .title { position: absolute; left: 0; top: 0; visibility: hidden; }
  .meta { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ui); margin-bottom: 2.6vh; }
  .line { font-family: 'Instrument Serif', Georgia, serif; font-size: min(7.4vw, 11vh); line-height: 1.04; white-space: nowrap; will-change: clip-path, transform; }
  #frame { position: absolute; right: 9vw; top: 13vh; width: 32vw; height: 66vh; }
  .img { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .art { position: absolute; inset: 0; will-change: transform; }
  #cap { position: absolute; left: 0; top: calc(100% + 12px); font-size: 11px; letter-spacing: .2em; color: var(--ui); white-space: nowrap; }
  #rail { position: fixed; right: 3.4vw; top: 20vh; height: 60vh; width: 1px; background: var(--dim); }
  #rail i { position: absolute; left: -4px; width: 9px; height: 1px; background: var(--dim); transition: left .3s, width .3s, background .3s; }
  #rail i.on { left: -9px; width: 19px; background: var(--fg); }
  #fill { position: absolute; left: 0; top: 0; width: 1px; background: var(--fg); }
  #count { position: absolute; top: calc(100% + 12px); right: -6px; font-size: 10px; letter-spacing: .15em; color: var(--ui); white-space: nowrap; }
  #hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 11px; letter-spacing: .3em; color: var(--ui); opacity: .8; transition: opacity .6s; pointer-events: none; }
  #hint.off { opacity: 0; }
  #mode { position: fixed; top: 18px; right: 18px; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: none; border: 1px solid; color: var(--ui); font-size: 16px; line-height: 1; cursor: pointer; padding: 0; }
  #label { position: fixed; left: 18px; bottom: 16px; font-size: 11px; letter-spacing: .18em; color: var(--fg); opacity: .4; }
  @media (max-aspect-ratio: 1/1) {
    :root { --num: min(30vw, 22vh); }
    #titles { width: 80vw; top: 11vh; }
    .line { font-size: min(11vw, 6.5vh); }
    #frame { left: 5vw; right: 15vw; width: auto; top: 40vh; height: calc(100vh - 40vh - var(--num) - 14vh); }
    #num { font-size: var(--num); bottom: 6vh; }
    #hint { top: 20px; bottom: auto; left: 18px; transform: none; letter-spacing: .2em; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="titles"></div>
  <div id="frame"><div id="cap"></div></div>
  <div id="num"></div>
</div>
<div id="rail"><div id="fill"></div><div id="count"></div></div>
<div id="hint">DRAG &varr; OR CLICK</div>
<button id="mode" title="light / dark">&#9680;</button>
<div id="label">SCROLL INDEX</div>
<script>
// ---- CONFIG ----
const ENTRIES = [
  ['Texture exploration', 'Texture'],
  ['Launch anticipation', 'Motion'],
  ['Technical illustration', 'Illustration'],
  ['Award system', 'Identity'],
  ['Kinetic wordmark', 'Type'],
  ['Material study', 'Texture'],
  ['Grid as language', 'Systems'],
  ['Signal and noise', 'Motion'],
  ['Night editions', 'Editorial'],
  ['Variable voices', 'Type'],
  ['Quiet interfaces', 'Product'],
  ['Studio index', 'Identity'],
];
const YEAR = 2026;
const EASE = 0.085;
const STAGGER = 0.14;
const DRAG_VH = 0.35; // viewport heights of drag per entry
const TAP_PX = 6;
const THEMES = {
  dark:  { bg: '#0a0a0a', fg: '#e8e6e1', dim: 'rgba(232,230,225,0.18)', ui: 'rgba(232,230,225,.6)', mid: '#1b1a18' },
  light: { bg: '#edeae3', fg: '#14120f', dim: 'rgba(20,18,15,0.18)',    ui: 'rgba(20,18,15,.6)',    mid: '#d8d4ca' }
};
let theme = THEMES.dark;
// ----------------
// no scroll: the N4 lab popup owns the wheel, so this is driven by drag, click and left/right keys

const N = ENTRIES.length;
const ease = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : EASE;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(3, '0');
const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;

function applyTheme() {
  for (const k in theme) document.documentElement.style.setProperty('--' + k, theme[k]);
}
$('#mode').addEventListener('click', () => { theme = theme === THEMES.dark ? THEMES.light : THEMES.dark; applyTheme(); });
applyTheme();

const strips = [];
for (let c = 0; c < 3; c++) {
  const col = document.createElement('div'); col.className = 'col';
  const s = document.createElement('div'); s.className = 'strip';
  s.innerHTML = '01234567890'.split('').map(d => `<span>${d}</span>`).join('');
  col.appendChild(s); $('#num').appendChild(col); strips.push(s);
}

function art(i) {
  const a = (i * 47) % 180, g = 8 + (i % 4) * 5;
  const x = 20 + (i * 37) % 60, y = 25 + (i * 53) % 50;
  return [
    `repeating-linear-gradient(${a}deg, var(--fg) 0 1px, transparent 1px ${g}px), var(--mid)`,
    `radial-gradient(circle at ${x}% ${y}%, var(--fg) 0 22%, transparent 22.4%), var(--mid)`,
    `repeating-radial-gradient(circle at 50% 110%, var(--fg) 0 1px, transparent 1.5px ${g + 4}px), var(--mid)`,
    `conic-gradient(from ${a}deg at ${x}% 50%, var(--fg), var(--mid) 25%, var(--fg) 50%, var(--mid) 75%, var(--fg))`,
    `radial-gradient(var(--fg) 1.2px, transparent 1.7px) 0 0 / ${g + 6}px ${g + 6}px, var(--mid)`,
    `linear-gradient(${a}deg, var(--mid) 0 ${y}%, var(--fg) ${y}% calc(${y}% + 1px), var(--mid) 0), linear-gradient(180deg, var(--mid), var(--fg))`,
  ][i % 6];
}

const items = ENTRIES.map(([title, tag], j) => {
  const t = document.createElement('div'); t.className = 'title';
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = `${tag} — ${YEAR}`;
  t.appendChild(meta);
  const lines = title.split(' ').map(w => {
    const l = document.createElement('div'); l.className = 'line'; l.textContent = w;
    t.appendChild(l); return l;
  });
  $('#titles').appendChild(t);
  const img = document.createElement('div'); img.className = 'img';
  const a = document.createElement('div'); a.className = 'art'; a.style.background = art(j);
  img.appendChild(a); $('#frame').insertBefore(img, $('#cap'));
  return { t, parts: [meta, ...lines], img, art: a };
});

const ticks = ENTRIES.map((_, j) => {
  const i = document.createElement('i');
  i.style.top = (j / (N - 1)) * 100 + '%';
  $('#rail').appendChild(i); return i;
});

const fill = $('#fill'), cap = $('#cap'), count = $('#count'), hint = $('#hint');
const PLACES = [100, 10, 1];

function digit(v, place) {
  if (place === 1) return v % 10;
  return Math.floor(v / place) % 10 + Math.max(0, (v % place) - (place - 1));
}

let target = 0, cur = 0, last = -1, shown = -1, raf = 0, drag = null;

function render() {
  const v = cur + 1;
  for (let c = 0; c < 3; c++) strips[c].style.transform = `translateY(${-digit(v, PLACES[c])}em)`;
  for (let j = 0; j < N; j++) {
    const it = items[j], d = cur - j;
    const a = d > 0 ? clamp(1 - 2 * d) : clamp(1 + 2 * d);
    const on = a > 0;
    it.t.style.visibility = it.img.style.visibility = on ? 'visible' : 'hidden';
    if (!on) continue;
    const L = it.parts.length;
    for (let k = 0; k < L; k++) {
      const el = it.parts[k];
      const r = clamp((a - k * STAGGER) / (1 - (L - 1) * STAGGER));
      const h = (1 - r) * 100;
      el.style.clipPath = d > 0 ? `inset(${h}% 0 0 0)` : `inset(0 0 ${h}% 0)`;
      el.style.transform = `translateY(${(d > 0 ? -1 : 1) * (1 - r) * 35}%)`;
    }
    const e = a * a * (3 - 2 * a), s = (1 - e) * 50;
    it.img.style.clipPath = `inset(${s}% 0 ${s}% 0)`;
    it.art.style.transform = `scale(${1.35 - 0.35 * e})`;
  }
  const n = Math.round(cur);
  if (n !== shown) {
    if (shown >= 0) ticks[shown].classList.remove('on');
    ticks[n].classList.add('on');
    shown = n;
    cap.textContent = `FIG. ${pad(n + 1)} — ${ENTRIES[n][1].toUpperCase()}`;
    count.textContent = `${pad(n + 1)}/${pad(N)}`;
  }
  fill.style.height = (cur / (N - 1)) * 100 + '%';
}

// LOOP
// runs only while easing or dragging, sleeps once settled
function frame() {
  raf = 0;
  cur += (target - cur) * ease;
  if (Math.abs(target - cur) < 1e-4) cur = target;
  if (cur !== last) { last = cur; render(); }
  if (cur !== target || drag) raf = requestAnimationFrame(frame);
}
function wake() { if (!raf) raf = requestAnimationFrame(frame); }

function go(i) {
  target = ((i % N) + N) % N;
  hint.classList.add('off');
  wake();
}

// INPUT
addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('button')) return;
  drag = { id: e.pointerId, y: e.clientY, from: target, moved: false };
  document.body.setPointerCapture(e.pointerId);
}, { passive: true });
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dy) < TAP_PX) return;
  if (!drag.moved) { drag.moved = true; document.body.classList.add('drag'); hint.classList.add('off'); }
  const t = drag.from - dy / (innerHeight * DRAG_VH);
  target = t < 0 ? 0 : t > N - 1 ? N - 1 : t;
  wake();
}, { passive: true });
function release(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const moved = drag.moved;
  drag = null;
  document.body.classList.remove('drag');
  if (moved) go(Math.round(target));
  else if (e.type === 'pointerup') go(Math.round(target) + 1);
  else wake();
}
addEventListener('pointerup', release, { passive: true });
addEventListener('pointercancel', release, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(Math.round(target) + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(Math.round(target) - 1); }
});

render();
</script>
</body>
</html>
