<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grain Gradient</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .ui { position: fixed; bottom: 16px; font: 11px 'Cascadia Mono', Consolas, monospace; letter-spacing: 2px; opacity: .45; pointer-events: none; user-select: none; }
  #label { left: 18px; }
  #name { right: 18px; }
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font: 13px 'Cascadia Mono', Consolas, monospace; letter-spacing: 3px; opacity: .6; }
  #mode { position: fixed; top: 18px; right: 18px; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: none; border: 1px solid; font-size: 16px; line-height: 1; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback">WEBGL NOT AVAILABLE</div>
<button id="mode" title="light / dark">&#9680;</button>
<div class="ui" id="label">GRAIN GRADIENT</div>
<div class="ui" id="name"></div>
<script>
// ---- CONFIG ----
const SPEED = 1;
const WARP = 0.55;
const GRAIN = 0.07;
const VIGNETTE = 0.35;
const FADE = 2.2;
const MAX_DPR = 2;
const THEMES = {
  dark: { bg: '#0a0a0a', fg: '#e8e6e1', ui: 'rgba(232,230,225,.75)', palettes: [
    { name: 'EMBER',  base: '#0b0a09', cols: ['#ff3b1f', '#ff9a4d', '#5b1a0e', '#2a2320', '#e8c9a8'] },
    { name: 'TIDE',   base: '#05080c', cols: ['#1f4fff', '#00b3a4', '#0b1d3a', '#9fd6ff', '#2a1f5c'] },
    { name: 'ORCHID', base: '#0a0710', cols: ['#b04dff', '#ff4f9a', '#2b0f3d', '#ffd1e8', '#3d2bff'] }
  ] },
  light: { bg: '#edeae3', fg: '#14120f', ui: 'rgba(20,18,15,.7)', palettes: [
    { name: 'PAPER', base: '#edeae3', cols: ['#ff3b1f', '#f7c59f', '#d6e0f0', '#ffd75e', '#c9c1ff'] },
    { name: 'MINT',  base: '#eef0ea', cols: ['#9be3c9', '#4fa3ff', '#f3e7b3', '#ffb3a7', '#d9f2ff'] },
    { name: 'DUSK',  base: '#efe9e6', cols: ['#ff9aa2', '#b5a8ff', '#ffd8be', '#7ec4cf', '#f6f0c4'] }
  ] }
};
let theme = THEMES.dark;
// ----------------

const cv = document.getElementById('c');
const modeBtn = document.getElementById('mode');
const nameEl = document.getElementById('name');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });

const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 u_res;
uniform float u_time, u_seed, u_grain, u_vig, u_warp;
uniform vec3 u_base;
uniform vec3 u_col[5];
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * .1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y);
}
void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  float asp = u_res.x / u_res.y, t = u_time;
  vec2 p = vec2(uv.x * asp, uv.y);
  vec2 w = vec2(noise(p * 1.4 + vec2(0., t * .07)), noise(p * 1.4 + vec2(5.2, 1.3 - t * .06))) - .5;
  p += w * u_warp;
  vec3 acc = u_base * .35;
  float ws = .35;
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    vec2 c = vec2(noise(vec2(t * .08 + fi * 3.1, fi * 7.3)), noise(vec2(fi * 5.7, t * .07 + fi * 1.9)));
    c = (c - .5) * 1.7 + .5;
    c.x *= asp;
    float d = length(p - c), r = .38 + .1 * sin(t * .2 + fi * 2.);
    float k = exp(-d * d / (r * r));
    acc += u_col[i] * k;
    ws += k;
  }
  vec3 col = acc / ws;
  vec2 v = uv - .5;
  col *= 1. - u_vig * dot(v, v) * 1.6;
  col += (hash(gl_FragCoord.xy + u_seed * 500.) - .5) * u_grain;
  gl_FragColor = vec4(col, 1.);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function fail() {
  cv.style.display = 'none';
  document.getElementById('fallback').style.display = 'flex';
}

const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const paletteArray = p => new Float32Array([...hexRGB(p.base), ...p.cols.flatMap(hexRGB)]);

let prog, U = {}, pal = 0, cur, target;

function setTarget() {
  const p = theme.palettes[pal % theme.palettes.length];
  target = paletteArray(p);
  nameEl.textContent = `PALETTE ${pal % theme.palettes.length + 1}/${theme.palettes.length} — ${p.name}`;
}

function applyTheme() {
  document.body.style.background = theme.bg;
  document.body.style.color = theme.fg;
  modeBtn.style.color = modeBtn.style.borderColor = theme.ui;
  if (gl) setTarget();
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}

function init() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['u_res', 'u_time', 'u_seed', 'u_grain', 'u_vig', 'u_warp', 'u_base', 'u_col']) U[n] = gl.getUniformLocation(prog, n);
  gl.uniform1f(U.u_grain, GRAIN);
  gl.uniform1f(U.u_vig, VIGNETTE);
  gl.uniform1f(U.u_warp, WARP);
}

let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  time += dt * SPEED * (reduce ? 0.2 : 1);
  const f = 1 - Math.exp(-dt * FADE);
  for (let i = 0; i < cur.length; i++) cur[i] += (target[i] - cur[i]) * f;
  gl.uniform2f(U.u_res, cv.width, cv.height);
  gl.uniform1f(U.u_time, time);
  gl.uniform1f(U.u_seed, reduce ? 0 : Math.random());
  gl.uniform3fv(U.u_base, cur.subarray(0, 3));
  gl.uniform3fv(U.u_col, cur.subarray(3));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

modeBtn.addEventListener('click', () => { theme = theme === THEMES.dark ? THEMES.light : THEMES.dark; applyTheme(); });
applyTheme();

if (!gl) fail();
else {
  try {
    init();
    cur = paletteArray(theme.palettes[0]);
    resize();
    addEventListener('resize', resize);
    cv.addEventListener('click', () => { pal++; setTarget(); });
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); fail(); });
    requestAnimationFrame(frame);
  } catch (err) {
    console.warn(err);
    fail();
  }
}
</script>
</body>
</html>
